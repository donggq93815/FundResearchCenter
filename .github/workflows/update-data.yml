name: 基金数据每日更新

on:
  # 每个工作日（周一至周五）北京时间 20:30 运行（UTC 12:30）
  schedule:
    - cron: "30 12 * * 1-5"
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install requests

      - name: 拉取行情数据（三源交叉验证 + 全市场）
        env:
          YINGMI_API_KEY: ${{ secrets.YINGMI_API_KEY }}
        run: |
          cd data_service
          python run.py --all

      - name: 检查数据是否生成
        run: |
          test -f data_service/output/funds.json && echo "funds.json 已生成"
          test -f data_service/output/all_funds.json && echo "all_funds.json 已生成"

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_service/output/funds.json data_service/output/all_funds.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 每日行情数据更新 $(date '+%Y-%m-%d')"
            git push
          fi
